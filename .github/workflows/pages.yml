name: pages

# Publishes site/ to GitHub Pages. Fonts are fetched at build time and self-hosted,
# so visitors' browsers never call a third party.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-host fonts
        run: node site/tools/fetch-fonts.mjs
      - name: Stamp version
        run: |
          v=$(node -p "require('./package.json').version")
          sed -i "s|<span data-version>[^<]*</span>|<span data-version>${v}</span>|" site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
